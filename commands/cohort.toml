description = "BarMatrix cohort simulation (e.g. /cohort simulate <q-file>, /cohort grade <responses>, /cohort calibrate)"
prompt = "User typed: /cohort {{args}}.\n\nIf {{args}} is empty: list cohort personas by reading agents/cohort/*.md. Show name + their characteristic trait. Also list recent simulations from <cwd>/.reuben/cohort-runs.jsonl if any.\n\nSub-commands:\n\n- 'simulate <question-file>': read the file (containing question text + answer choices + correct answer if available). Spawn 6 cohort persona subagents IN PARALLEL using the Agent tool with subagent_type set to each persona name (cohort-competent-prep-student, cohort-speedy-but-careless, cohort-detail-oriented, cohort-weak-on-fact-pattern, cohort-weak-on-rule, cohort-panicker). Each receives the question and returns answer + reasoning. Reconcile into a Cohort Simulation report (see skills/cohort/README.md format). Append run record to <cwd>/.reuben/cohort-runs.jsonl.\n\n- 'grade <responses-file>': read actual cohort responses, grade against model rule, identify common error patterns. Output grading distribution + tension-point hits.\n\n- 'calibrate': read <cwd>/.reuben/cohort-runs.jsonl, compare predicted difficulty to actual cohort performance for resolved entries. Output calibration snapshot.\n\nThis is /cohort — distinct from /team (general critic council). Use /cohort for MBE-specific simulation, /team for general multi-perspective review."
