description = "Switch output style (e.g. /style court-reporter, /style off, or /style alone to list)"
prompt = "User typed: /style {{args}}. The UserPromptSubmit hook has already processed this and updated the active style flag. Your job: confirm the action concisely.\n\nIf {{args}} is empty: list available styles by reading the directory names in skills/styles/ — give a one-line description of each from each SKILL.md description field. Do NOT load the full skill bodies, just enumerate.\n\nIf {{args}} is 'off': confirm the style is disabled for this session.\n\nOtherwise ({{args}} is a style name): confirm the style is now active. Mention it persists for the session and can be cleared with /style off. Do not output the full skill ruleset — the hook handles activation."
