description = "Reasoning effort (e.g. /depth quick, /depth thorough, /depth off, alone to list)"
prompt = "User typed: /depth {{args}}. Hook updated the active flag.\n\nIf empty: list available modes from skills/depth/*/SKILL.md.\n\nIf 'off': confirm — reverts to medium (default Claude reasoning).\n\nOtherwise: confirm depth mode is active. Reminder: quick = first-pass; medium = default with 2-3 alternatives; thorough = full deliberation with explicit weighing."
