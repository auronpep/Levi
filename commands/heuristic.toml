description = "Engage explicit reasoning heuristics (e.g. /heuristic chesterton-fence,inversion, /heuristic off, alone to list)"
prompt = "User typed: /heuristic {{args}}. Hook updated ~/.claude/.reuben-heuristic (csv).\n\nIf {{args}} is empty: list available heuristics from skills/heuristic/*/SKILL.md.\n\nIf {{args}} is 'off': confirm — no heuristics engaged.\n\nOtherwise (csv): confirm heuristics active. Reminder: heuristics stack — multiple at once is fine. Different from /think (process) and /channel (lens) — heuristics are explicit named reasoning rules. Available: chesterton-fence, inversion, five-whys, first-principles, occams-razor, pareto."
