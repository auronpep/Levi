description = "Engage stackable guardrails (e.g. /rules clarify,test-first, /rules off, or /rules alone to list)"
prompt = "User typed: /rules {{args}}. The UserPromptSubmit hook has updated the active rules flag.\n\nIf {{args}} is empty: list available rules by reading skills/rules/*/SKILL.md (skip README). Show name + description.\n\nIf {{args}} is 'off': confirm all rules disabled.\n\nOtherwise ({{args}} is a single name or csv): confirm the listed rules are active. They stack — multiple rules' bodies concatenate. Mention persistence and that they take precedence over output-shape preferences when conflict arises (e.g. no-secrets wins over any style)."
