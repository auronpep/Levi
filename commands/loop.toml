description = "Engage iteration mode (e.g. /loop simple, /loop reviewed, /loop until, /loop off, or /loop alone to list)"
prompt = "User typed: /loop {{args}}. The hook has updated the active loop flag.\n\nIf {{args}} is empty: list available modes by reading skills/loop/*/SKILL.md (skip README). Show name + description.\n\nIf {{args}} is 'off': confirm loop disabled. Existing TodoWrite list is preserved; you just stop auto-advancing.\n\nOtherwise ({{args}} is mode name): confirm the mode is active. Brief reminder of pattern (simple = sequential, reviewed = with reviewer gate, adversarial = with red-team, council = with full /team, until = iterate single artifact). The TodoWrite tool tracks tasks; this axis just shapes how you advance through them."
