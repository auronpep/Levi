description = "Codebase reconnaissance (e.g. /recon for one-shot scan, /recon on for persistent, /recon off)"
prompt = "User typed: /recon {{args}}. Hook may have updated persistence flag.\n\nIf {{args}} is empty (one-shot): perform reconnaissance of current repo. Read README.md, CLAUDE.md, CONTRIBUTING.md. Identify entry points (package.json scripts, Makefile, main files). Map top-level directory structure to depth 2. Identify language, framework, test runner, linter, CI system. Surface conventions and gotchas. Output structured recon report following skills/recon/README.md format. Recommend 1-3 concrete next steps.\n\nIf {{args}} is 'on': enable persistent mode — SessionStart hook will run recon at start of every session in this directory.\n\nIf {{args}} is 'off': disable persistent mode."
