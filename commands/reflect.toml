description = "Run post-work reflection (e.g. /reflect lesson, /reflect missed, /reflect off, or /reflect alone to list)"
prompt = "User typed: /reflect {{args}}. The hook has updated the active reflect kind (for persistent mode) or this is being treated as a one-shot.\n\nIf {{args}} is empty: list available reflection kinds by reading skills/reflect/*/SKILL.md (skip README). Show name + description.\n\nIf {{args}} is 'off': confirm persistent reflect mode disabled.\n\nIf {{args}} is '<kind> on': confirm persistent mode active. End-of-session Stop hook will run this reflection automatically.\n\nOtherwise ({{args}} is a kind): run the named reflection ONE-SHOT now. Read skills/reflect/{{args}}/SKILL.md and produce the analysis described there. Output is printed in conversation. If active /dossier is set and the kind is 'lesson', also append the lesson to the dossier."
